<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="google-site-verification" content="l5IildTRONKMW6E33TQVciUE6KtFiAXQJB9olCn_PnI" />
  <title>Registration – NYCU Theory Day 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="style.css?v=2026-11-23-4" />
</head>

<body>

<div class="page-container">

<main>

  <h1 style="color: #003366; margin-bottom: 10px;">Registration</h1>

  <div id="registration-content" class="registration-intro"></div>

  <div class="registration-options">
    <section class="registration-option" aria-labelledby="general-registration-title">
      <p class="registration-label">Attend</p>
      <h2 id="general-registration-title">General Registration</h2>
      <p class="registration-price">Free</p>
      <p>Open to all participants, including students and non-students.</p>
      <div class="registration-actions">
        <a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLSeRRQ0hjcVjNvWXxbtcUQiV4DYR3sJ4s_z82zJkcpp65BARDw/viewform?usp=dialog" target="_blank" rel="noopener noreferrer">Register</a>
      </div>
    </section>

    <section class="registration-option" aria-labelledby="sponsorship-title">
      <p class="registration-label">Support</p>
      <h2 id="sponsorship-title">Sponsor the Event</h2>
      <p class="registration-price">NT$ 1,000</p>
      <p>For participants who would like to support the event. A receipt will be provided. Sponsorship registration will open soon.</p>
      <div id="sponsorship-actions" class="registration-actions" aria-live="polite">
        <a id="sponsorship-payment-button" class="btn is-disabled" aria-disabled="true">Opening soon</a>
      </div>
    </section>
  </div>

  <style>
    .registration-intro {
      margin-bottom: 28px;
    }

    .registration-intro p {
      margin: 8px 0;
      color: #555;
    }

    .registration-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border-top: 1px solid #1f2937;
      border-bottom: 1px solid var(--border, #e5e5e5);
      margin: 24px 0 40px;
    }

    .registration-option {
      display: flex;
      flex-direction: column;
      padding: 24px 28px 28px 0;
    }

    .registration-option + .registration-option {
      padding: 24px 0 28px 28px;
      border-left: 1px solid var(--border, #e5e5e5);
    }

    .registration-label {
      margin: 0 0 6px;
      color: #6b7280;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .registration-option h2 {
      margin: 0;
      color: #003366;
      font-size: 1.3rem;
    }

    .registration-option .registration-price {
      margin: 4px 0 0;
      color: #1f2937;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .registration-option p {
      margin: 14px 0 20px;
      color: #555;
      line-height: 1.6;
    }

    .registration-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: auto;
    }

    .registration-option .btn {
      display: inline-block;
      background-color: var(--accent, #2f4a6d);
      color: #fff;
      padding: 9px 22px;
      border: 1px solid var(--accent, #2f4a6d);
      border-radius: 3px;
      font-size: 0.95em;
      font-weight: 500;
      transition: background 0.15s;
    }

    .registration-option .btn:hover {
      background-color: #1f3550;
      text-decoration: none;
    }

    .registration-option .btn.is-disabled,
    .registration-option .btn.is-disabled:hover {
      background: transparent;
      color: #6b7280;
      border-color: #d1d5db;
      cursor: not-allowed;
    }

    @media (max-width: 640px) {
      .registration-options {
        grid-template-columns: 1fr;
      }

      .registration-option,
      .registration-option + .registration-option {
        padding: 22px 0;
        border-left: 0;
      }

      .registration-option + .registration-option {
        border-top: 1px solid var(--border, #e5e5e5);
      }
    }
  </style>

</main>

<script src="site-data.js"></script>
<script src="site-content.js"></script>

<script src="cache-utils.js"></script>
<script>
  if (window.cacheUtils && typeof window.cacheUtils.setupAutoUpdateCheck === 'function') {
    window.cacheUtils.setupAutoUpdateCheck({ versionUrl: 'site-version.json', intervalMs: 120000 });
  }
</script>
<script src="load-footer.js"></script>
<script src="load-header.js"></script>
<script src="load-hero.js"></script>
<script src="page-loader.js?v=2026-11-18-1"></script>
<script src="banner.js"></script>

</div>

</body>
</html>
