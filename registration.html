<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="google-site-verification" content="l5IildTRONKMW6E33TQVciUE6KtFiAXQJB9olCn_PnI" />
  <title>Registration – NYCU Theory Day 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="page-container">

<main>

  <h1 style="color: #003366; margin-bottom: 10px;">Registration</h1>

  <div id="registration-content" class="registration-intro"></div>

  <div class="registration-options">
    <section class="registration-card registration-card--general" aria-labelledby="general-registration-title">
      <div class="registration-card-heading">
        <h2 id="general-registration-title">General Registration</h2>
        <span class="registration-price">Free</span>
      </div>
      <p>Open to all participants, including students and non-students.</p>
      <a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLSeRRQ0hjcVjNvWXxbtcUQiV4DYR3sJ4s_z82zJkcpp65BARDw/viewform?usp=dialog" target="_blank" rel="noopener noreferrer">
        Register for free
      </a>
    </section>

    <section class="registration-card registration-card--sponsor" aria-labelledby="sponsorship-title">
      <div class="registration-card-heading">
        <h2 id="sponsorship-title">Sponsor the Event</h2>
        <span class="registration-price">NT$ 1,000</span>
      </div>
      <p>For participants who would like to support the event. A receipt will be provided.</p>
      <div id="sponsorship-actions" class="registration-actions" aria-live="polite">
        <a
          id="sponsorship-payment-button"
          class="btn"
          href="https://example.com/payment"
          target="_blank"
          rel="noopener noreferrer"
        >I want to Sponsor!</a>
      </div>
      <!-- <p class="registration-form-note">If needed, an additional form button for receipt or certificate details will appear here.</p> -->
    </section>
  </div>

  <style>
    .registration-intro {
      margin-bottom: 28px;
    }

    .registration-intro p {
      margin: 8px 0;
      color: #555;
    }

    .registration-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      margin: 24px 0 40px;
    }

    .registration-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 24px;
      border: 1px solid var(--border, #e5e5e5);
      border-top: 4px solid var(--accent, #2c3e50);
      border-radius: 8px;
      background: #f8fafc;
      min-height: 240px;
      margin-bottom: 0;
    }

    .registration-card--general {
      border-color: #c8d8e8;
      border-top-color: #2f4a6d;
      background: #f3f7fb;
    }

    .registration-card--sponsor {
      border-color: #ead7a6;
      border-top-color: #805500;
      background: #fff9ed;
    }

    .registration-card-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px 16px;
      width: 100%;
    }

    .registration-card h2 {
      margin: 0;
      color: #003366;
      font-size: 1.25rem;
    }

    .registration-price {
      color: #003366;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .registration-card p {
      margin: 16px 0;
      color: #555;
    }

    .registration-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      width: 100%;
      margin-top: auto;
    }

    .registration-card--general > .btn {
      align-self: center;
      margin-top: auto;
    }

    .registration-card .btn {
      display: inline-block;
      background-color: var(--accent, #2c3e50);
      color: white;
      padding: 12px 32px;
      font-size: 1em;
      border-radius: 6px;
      transition: background 0.2s;
      font-weight: 500;
      text-align: center;
    }

    .registration-card .btn:hover {
      background-color: #1f3550;
      text-decoration: none;
    }

    .registration-card--sponsor h2,
    .registration-card--sponsor .registration-price {
      color: #805500;
    }

    .registration-form-note {
      margin-bottom: 0 !important;
      font-size: 0.9rem;
    }

    @media (max-width: 640px) {
      .registration-options {
        grid-template-columns: 1fr;
      }

      .registration-card {
        min-height: 0;
      }
    }
  </style>

</main>

<script src="site-data.js"></script>
<script src="site-content.js"></script>

<script src="cache-utils.js"></script>
<script>
  if (window.cacheUtils && typeof window.cacheUtils.setupAutoUpdateCheck === 'function') {
    window.cacheUtils.setupAutoUpdateCheck({ versionUrl: 'site-version.json', intervalMs: 120000 });
  }
</script>
<script src="load-footer.js"></script>
<script src="load-header.js"></script>
<script src="load-hero.js"></script>
<script src="page-loader.js?v=2026-11-18-1"></script>
<script src="banner.js"></script>

</div>

</body>
</html>
